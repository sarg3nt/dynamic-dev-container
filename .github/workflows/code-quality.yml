name: Code Quality and Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allows manual triggering

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: false
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:80

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # One invocation so a single failing file fails the job. (Previously every
      # step ended in `|| true`, so the lint could never fail — pure decoration.)
      - name: Run ShellCheck
        run: |
          # Portable array build (no `mapfile`, which needs bash 4+).
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            {
              find scripts workflow_scripts usr -type f -name '*.sh' 2>/dev/null
              for f in install.sh dev.sh run.sh; do [ -f "$f" ] && echo "$f"; done
            } | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} script(s):"
          printf '  %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"

  dockerfile-quality:
    name: Dockerfile Quality
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  configuration-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            files.pythonhosted.org:443
            pypi.org:443

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install YAML parser
        run: pip install pyyaml

      # Parses every config file and FAILS on the first syntax error. JSON and
      # TOML use the stdlib (json / tomllib); YAML uses pyyaml. node_modules and
      # .git are skipped. Previously this job swallowed all errors and even
      # called the non-existent `tomli_w.load`, so it validated nothing.
      - name: Validate config files
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib
          import yaml

          # os.walk (not glob) so hidden files/dirs like .github, .mise.toml,
          # and .pre-commit-config.yaml are included. node_modules/.git pruned.
          PRUNE = {"node_modules", ".git"}
          errors = []

          def files(*exts):
              for root, dirs, names in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in PRUNE]
                  for name in names:
                      if name.rsplit(".", 1)[-1] in exts:
                          yield os.path.join(root, name)

          def strip_jsonc(text):
              # Remove // and /* */ comments, skipping anything inside strings.
              out, i, n = [], 0, len(text)
              in_str = esc = False
              while i < n:
                  c = text[i]
                  if in_str:
                      out.append(c)
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                  elif c == '"':
                      in_str = True
                      out.append(c)
                      i += 1
                  elif c == "/" and i + 1 < n and text[i + 1] == "/":
                      while i < n and text[i] != "\n":
                          i += 1
                  elif c == "/" and i + 1 < n and text[i + 1] == "*":
                      i += 2
                      while i + 1 < n and not (text[i] == "*" and text[i + 1] == "/"):
                          i += 1
                      i += 2
                  else:
                      out.append(c)
                      i += 1
              return "".join(out)

          for f in files("yml", "yaml"):
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  errors.append(f"YAML  {f}: {e}")

          for f in files("json"):
              raw = open(f).read()
              try:
                  json.loads(raw)
              except Exception:
                  # VS Code configs (devcontainer.json, cspell.json) are JSONC:
                  # tolerate comments + trailing commas, but still catch real errors.
                  cleaned = re.sub(r",(\s*[}\]])", r"\1", strip_jsonc(raw))
                  try:
                      json.loads(cleaned)
                  except Exception as e:
                      errors.append(f"JSON  {f}: {e}")

          for f in files("toml"):
              try:
                  with open(f, "rb") as fh:
                      tomllib.load(fh)
              except Exception as e:
                  errors.append(f"TOML  {f}: {e}")

          if errors:
              print("Config validation FAILED:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)
          print("All YAML/JSON/TOML config files parsed cleanly.")
          PY

      - name: Check for required files
        run: |
          missing=0
          for f in Dockerfile .mise.toml requirements.txt pyproject.toml package.json .pre-commit-config.yaml; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f is missing"
              missing=1
            fi
          done
          exit "$missing"
