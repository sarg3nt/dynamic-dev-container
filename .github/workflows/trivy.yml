# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Trivy

# Single source of container vulnerability scanning: build the image and feed
# results to the GitHub code-scanning dashboard (SARIF). Runs on PRs, main
# pushes, and weekly. container-test.yml handles functional build tests and no
# longer rebuilds the image just to scan it.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # Only rebuild + scan the image when something that affects it changes.
    # Skips doc/config-only PRs (e.g. dependabot.yml) — no point rebuilding
    # 700+ MB to scan a YAML edit. Mirrors container-test.yml's filter.
    paths:
      - "home/**"
      - "scripts/**"
      - "usr/**"
      - "workflow_scripts/**"
      - ".dockerignore"
      - ".mise.toml"
      - ".pre-commit-config.yaml"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "package.json"
      - "**/*.sh"
      - ".github/workflows/trivy.yml"
  schedule:
    - cron: "19 14 * * 5"
  workflow_dispatch: # Allows manual triggering

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    permissions:
      contents: read # actions/checkout (no SBOM is pushed, so write is not needed)
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          # audit (not block) for this job: the Trivy binary + vuln DB are
          # pulled from several CDNs (GitHub release assets, ghcr, public.ecr,
          # blob storage) whose hosts shift, and harden-runner's DNS-based
          # blocking is brittle against them (it intermittently fails to resolve
          # allowed hosts). Egress is still monitored/reported. Every other job
          # in this repo keeps egress-policy: block.
          egress-policy: audit

      - name: Log Into Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build Docker Image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}
          # Authenticate mise's GitHub API calls during the build (avoids the
          # unauthenticated rate limit). ARG-only in the Dockerfile, so not
          # baked into the image being scanned.
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}"
          format: "template"
          template: "@/contrib/sarif.tpl"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: "trivy-results.sarif"
