name: Auto Assign Reviewers

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: auto-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-assign:
    name: Auto Assign Reviewers
    runs-on: ubuntu-latest
    # Skip bot PRs (dependabot patch/minor PRs auto-merge — no reviewer needed).
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Assign reviewers
        uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          configuration-path: ".github/auto-assign.yml"
