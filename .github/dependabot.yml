# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Policy for this repo (mirrors the gearbox repo, improved):
#   - Monthly cadence on every ecosystem. Weekly produced a flood of single-dep
#     PRs that were impossible to keep up with.
#   - Everything is GROUPED so each ecosystem opens at most two PRs per run:
#       <ecosystem>-minor-patch  -> auto-merged by dependabot-auto-merge.yml
#       <ecosystem>-major        -> held for manual review (commented, not merged)
#     Splitting minor/patch from major matters: a group's update-type is the
#     highest member, so bundling a major in with patches would block the whole
#     group from auto-merging. Keeping them separate lets the safe stuff sail
#     through while majors wait for a human.
#   - Consistent labels + Conventional-Commit prefix so PRs are easy to triage.
#
# NOTE: Dependabot does not support YAML anchors or custom top-level keys, so the
# per-ecosystem blocks below are intentionally repetitive.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - github_actions
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - docker
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - python
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]
